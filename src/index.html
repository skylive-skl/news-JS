<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <input class="sources-search" type="search" placeholder="Search sources..." aria-label="Search sources" />
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer class="footer">
            <a class="footer__github" href="https://github.com/skylive-skl" target="_blank" rel="noopener noreferrer">
                skylive-skl
            </a>
            <span class="footer__year">2026</span>
            <a
                class="footer__course"
                href="https://rs.school/courses/javascript"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img class="footer__logo" src="img/rss-logo.svg" alt="RS School" width="40" height="40" />
            </a>
            <p class="footer__copyright">Powered by <a href="https://newsapi.org">NewsAPI</a></p>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
